name: Bug report
description: Something crashes or behaves differently than documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through the repository's
        **Security** tab → **Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, configuration or a minimal script.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Traceback or log, if any.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Version of the project (e.g. `pip show <package>`, release or image tag).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python / runtime version and other relevant versions.
      placeholder: "Ubuntu 24.04, Python 3.12"
